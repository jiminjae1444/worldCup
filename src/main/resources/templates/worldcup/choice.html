<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이상형 월드컵</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 90vw;
            height: 90vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 30px;
            color: #333;
            margin-bottom: 20px;
        }

        .round {
            font-size: 24px;
            color: #444;
            margin-bottom: 30px;
        }

        .choices {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 60%;
            gap: 10px;
        }

        .choice {
            width: 48%;
            height: 100%;
            background-color: #f0f0f0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            position: relative;
            transition: transform 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .choice:hover {
            transform: scale(1.05);
        }

        .choice img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .choice-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            font-weight: bold;
            color: white;
        }

        .result {
            font-size: 24px;
            color: #007bff;
            margin-top: 30px;
        }

        .next-btn {
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 30px;
            display: none;
        }

        .next-btn:hover {
            background-color: #0056b3;
        }

        /* 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 1);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .modal button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .modal button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>이상형 월드컵</h1>
    <div class="round">1라운드</div>

    <div class="choices">
        <div class="choice" id="choice1" onclick="selectChoice(1)">
            <img src="https://via.placeholder.com/200x200?text=Choice+1" alt="Choice 1">
            <div class="choice-text">Choice 1</div>
        </div>
        <div class="choice" id="choice2" onclick="selectChoice(2)">
            <img src="https://via.placeholder.com/200x200?text=Choice+2" alt="Choice 2">
            <div class="choice-text">Choice 2</div>
        </div>
    </div>

    <div class="result" id="result"></div>

    <button class="next-btn" id="nextBtn" onclick="nextRound()">다음 라운드</button>
</div>

<!-- 모달 시작 -->
<div class="modal" id="itemModal">
    <div class="modal-content">
        <h2>아이템 개수 선택</h2>
        <label for="itemCount">아이템 개수:</label>
        <select id="itemCount">
            <!-- 동적으로 옵션이 추가됩니다 -->
        </select>
        <button onclick="startWorldCup()">시작하기</button>
    </div>
</div>

<script>
    let currentRound = 1
    let selectedChoice = null
    const maxRounds = 3
    let itemCount = 0  // 아이템 개수 변수

    // 모달을 보여주는 함수
    function showModal(itemCount) {
        const modal = document.getElementById("itemModal")
        const itemCountSelect = document.getElementById("itemCount")

        // 아이템 개수에 따라 선택 옵션을 동적으로 변경
        const options = getSelectableRounds(itemCount)
        itemCountSelect.innerHTML = '' // 기존 옵션 제거

        options.forEach(count => {
            const option = document.createElement("option")
            option.value = count
            option.textContent = count
            itemCountSelect.appendChild(option)
        })

        modal.style.display = "flex"
    }

    // 아이템 개수에 따라 선택 가능한 라운드 수 반환
    function getSelectableRounds(itemCount) {
        let rounds = []
        if (itemCount >= 256) {
            rounds = [16, 32, 64, 128, 256]
        } else if (itemCount >= 128) {
            rounds = [16, 32, 64, 128]
        } else if (itemCount >= 64) {
            rounds = [16, 32, 64]
        } else if (itemCount >= 32) {
            rounds = [16, 32]
        } else if (itemCount >= 16) {
            rounds = [16]
        }
        return rounds
    }

    // '시작하기' 버튼 클릭 시 월드컵 시작
    function startWorldCup() {
        const selectedRound = document.getElementById("itemCount").value
        itemCount = selectedRound; // 선택한 라운드 개수
        document.getElementById("itemModal").style.display = "none"  // 모달 닫기

        // 월드컵 시작 로직을 추가할 수 있습니다.
        console.log(`선택한 라운드: ${itemCount}`)
    }

    // 선택한 항목을 처리하는 함수
    function selectChoice(choice) {
        selectedChoice = choice
        document.getElementById('result').textContent = `선택한 항목: Choice ${choice}`
        document.getElementById('nextBtn').style.display = 'block' // '다음 라운드' 버튼 보이기
        // 선택지 비활성화
        disableChoices()
    }

    // '다음 라운드' 버튼 클릭 시 처리하는 함수
    function nextRound() {
        currentRound++

        if (currentRound > maxRounds) {
            document.getElementById('result').textContent = `결과: Choice ${selectedChoice}가 승리했습니다!`;
            document.getElementById('nextBtn').style.display = 'none' // '다음 라운드' 버튼 숨기기
        } else {
            // 라운드 갱신
            document.querySelector('.round').textContent = `${currentRound}라운드`
            document.getElementById('result').textContent = ''
            document.getElementById('nextBtn').style.display = 'none' // '다음 라운드' 버튼 숨기기

            // 선택지 업데이트 (단순 예시로 이미지 교체)
            updateChoices()
        }
    }

    // 선택지를 비활성화하는 함수
    function disableChoices() {
        document.getElementById('choice1').style.pointerEvents = 'none'
        document.getElementById('choice2').style.pointerEvents = 'none'
    }

    // 선택지를 업데이트하는 함수 (단순 예시)
    function updateChoices() {
        document.getElementById('choice1').innerHTML = `
            <img src="https://via.placeholder.com/200x200?text=Choice+${currentRound * 2 - 1}" alt="Choice ${currentRound * 2 - 1}">
            <div class="choice-text">Choice ${currentRound * 2 - 1}</div>
        `
        document.getElementById('choice2').innerHTML = `
            <img src="https://via.placeholder.com/200x200?text=Choice+${currentRound * 2}" alt="Choice ${currentRound * 2}">
            <div class="choice-text">Choice ${currentRound * 2}</div>
        `
    }

    // 모달을 처음에 띄우는 로직 (여기서는 임의로 아이템 개수를 128로 설정)
    window.onload = function() {
        showModal(128)  // 임의로 128개 아이템을 선택한 예시
    }
</script>

</body>
</html>
