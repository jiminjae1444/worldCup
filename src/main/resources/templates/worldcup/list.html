<!DOCTYPE html>
<html lang="ko"      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 목록</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }

        .category-card {
            width: 250px;
            height: auto; /* 높이를 유동적으로 설정 */
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .category-card:hover {
            transform: scale(1.05);
        }

        .category-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: auto; /* 카드 내용 높이를 자동으로 설정 */
        }

        .category-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .category-description {
            font-size: 14px;
            color: #777;
            margin: 10px 0;
            height: auto; /* 높이를 자동으로 설정 */
            max-height: 60px; /* 너무 긴 설명을 제한 */
            overflow: hidden; /* 넘치는 텍스트는 숨기기 */
        }

        .category-date {
            font-size: 12px;
            color: #aaa;
            text-align: right;
        }

        .delete-btn {
            width: 220px;
            border: none;
            font-size: 17px;
        }

        .view-btn,
        .item-manage-btn {
            display: block;
            background-color: #4c91af;
            color: #fff;
            padding: 8px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .view-btn:hover {
            background-color: #386e85;
        }

        /* 아이템 관리 버튼 스타일 */
        .item-manage-btn {
            background-color: #72910f; /* 아이템 관리 버튼에 오렌지 색상 추가 */
        }

        .item-manage-btn:hover {
            background-color: #4a5d0b;
        }

        /* 검색 폼 스타일 */
        .search-form {
            text-align: center;
            margin: 20px;
        }

        .search-form input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .search-form button {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-form button:hover {
            background-color: #0056b3;
        }

        /* 관리자 기능 버튼 */
        .admin-btns {
            text-align: center;
            margin-bottom: 20px;
        }

        .admin-btns button {
            padding: 10px 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .admin-btns button:hover {
            background-color: #e64a19;
        }
    </style>

    <style>
        .modal {
            display: none; /* 기본적으로 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 800px;
            overflow-y: auto;
            height: 80%;
        }

        .close-btn {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-left: auto;
            display: block;
        }

        .close-btn:hover {
            background-color: #e64a19;
        }

        .item-card {
            width: 250px;
            height: 300px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            display: inline-block;
            margin-right: 20px;
        }

        .item-card:hover {
            transform: scale(1.05);
        }

        .item-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .item-card .card-content {
            padding: 10px;
            text-align: center;
        }

        .item-card .item-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-card .view-btn {
            display: block;
            background-color: #4c91af;
            color: #fff;
            padding: 8px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            margin: 10px auto;
            transition: background-color 0.3s;
        }

        .item-card .view-btn:hover {
            background-color: #386e85;
        }

        /* 아이템 추가 버튼 스타일 */
        .add-item-btn {
            display: block;
            background-color: #ff5722;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
            margin: 20px auto;
            cursor: pointer;
        }

        .add-item-btn:hover {
            background-color: #e64a19;
        }

        /* 아이템 관리 모달의 리스트 컨테이너 */
        .item-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }


        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .form-group button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .form-group button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div th:replace="~{header.html}"></div>
<!-- 검색 폼 -->
<div class="search-form">
    <form action="#" th:action="@{/categories}" method="get">
        <input type="text" name="search" placeholder="카테고리 검색" th:value="${search}">
        <button type="submit">검색</button>
    </form>
</div>
<input type="hidden" id="userRoleInput" th:value="${userRole}">
<!-- 관리자 기능 버튼: 관리자 로그인 상태일 때만 보이도록 조건 추가 -->
<div class="admin-btns"  sec:authorize="hasRole('ROLE_ADMIN')">
    <button id="categoryAddBtn">카테고리 추가</button>
</div>

<!-- 카테고리가 없으면 메시지 표시 -->
<div th:if="${categories == null or categories.isEmpty()}" class="no-category-message">
    현재 진행할 수 있는 월드컵이 없습니다.
</div>
<div class="container">
    <!-- 카테고리 리스트 반복 출력 -->
    <div th:each="category : ${categories}" class="category-card">
        <!-- 이미지 -->
        <img th:src="@{'/upload/worldcup/category/' + ${category.file != null ? category.file.storedFileName : ''}}" alt="카테고리 이미지">


        <!-- 카드 내용 -->
        <div class="card-content" >
            <h3 class="category-name" th:text="${category.cName}">카테고리 이름</h3>
            <p class="category-description" th:text="${category.description}">카테고리 설명</p>
            <p class="category-date" th:text="'업데이트 일자: ' + ${#dates.format(category.ucDate, 'yyyy-MM-dd')}">업데이트 일자</p>

            <!-- 관리자가 로그인된 경우에만 수정/삭제 버튼 보이기 -->
            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <a href="#" class="view-btn" th:href="@{/worldcup/category/edit/{id}(id=${category.id})}">수정</a>
                <button class="view-btn delete-btn" th:attr="data-id=${category.id}">삭제</button>
            </div>

            <!-- 아이템 관리 버튼 (관리자만 표시) -->
            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <a href="javascript:void(0)" class="item-manage-btn" data-category-id="${category.id}">아이템 관리</a>
            </div>

            <a href="/worldcup/choice" class="view-btn">상세보기</a>
        </div>
    </div>
</div>

<!-- 아이템 관리 모달 -->
<div id="itemModal" class="modal">
    <div class="modal-content">
        <button class="close-btn">닫기</button>

        <h2>아이템 관리</h2>

        <!-- 아이템 추가 버튼 -->
        <button class="add-item-btn">아이템 추가</button>

        <!-- 아이템 목록 -->
        <div id="itemList" class="item-container">
            <!-- 아이템 카드가 여기에 동적으로 추가됩니다 -->
        </div>
    </div>
</div>
<!-- 아이템 추가 모달 -->
<div id="addItemModal" class="modal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeAddItemModal()">닫기</button>
        <h2>아이템 추가</h2>

        <!-- 아이템 추가 폼 -->
        <form id="addItemForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">아이템 이름</label>
                <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
                <label for="gender">성별</label>
                <select id="gender" name="gender" required>
                    <option value="남성">남성</option>
                    <option value="여성">여성</option>
                    <option value="없음">없음</option>
                </select>
            </div>
            <div class="form-group">
                <label for="file">아이템 이미지</label>
                <input type="file" id="file" name="file" required />
            </div>
            <div class="form-group">
                <button type="submit">아이템 추가</button>
            </div>
        </form>
    </div>
</div>
<script>
    const searchForm = document.getElementById('search-form')
    const searchInput = document.getElementById('search-input')
    const categoryContainer = document.getElementById('category-container')
    const categoryAddBtn = document.getElementById('categoryAddBtn')
    const userRole = document.getElementById('userRoleInput').value
    let currentCategoryId = null;

    async function searchHandler(event) {
        event.preventDefault()
        let search = searchInput.value.trim()
        if (!search) {
            alert('검색어를 입력해주세요')
            return
        }

        // 서버로 보낼 데이터 (검색어)
        const searchData = { search }

        const url = `categories/search?search=${encodeURIComponent(search)}`
        const opt = {
            method:'POST',
            body: JSON.stringify(searchData),
            'Content-Type': 'application/json'
        }

        const result = await fetch(url,opt).then(resp=>resp.json())
        if (result.categories.length > 0) {
            updateCategoryList(result.categories)  // 카테고리 목록 업데이트
        } else {
            categoryContainer.innerHTML = `<div class='no-category-message'>${result.message}</div>`
        }
    }



    // 카테고리 목록을 받아서 화면에 표시하는 함수
    function updateCategoryList(categories) {
        let categoryHTML = ''
        categories.forEach(function(category) {
            categoryHTML += `
    <div class="category-card" th:attr="data-id=${category.id}">
        <img src="/upload/worldcup/category/${category.file ? category.file.storedFileName : ''}" alt="카테고리 이미지">
        <div class="card-content">
            <h3 class="category-name">${category.cName}</h3>
            <p class="category-description">${category.description}</p>
            <p class="category-date">업데이트 일자: ${new Date(category.ucDate).toLocaleDateString('ko-KR')}</p>
            ${userRole === 'ROLE_ADMIN' ? `
                <a href="/categories/edit/${category.id}" class="view-btn">수정</a>
                <button class="view-btn delete-btn" data-id="${category.id}">삭제</button>
                <a href="javascript:void(0)" class="item-manage-btn" data-category-id="${category.id}">아이템 관리</a>
            ` : ''}
            <a href="/worldcup/choice" class="view-btn">상세보기</a>
        </div>
    </div>
        `
        })
        categoryContainer.innerHTML = categoryHTML
        addDeleteEventListeners()
    }

    function addDeleteEventListeners() {
        const deleteButtons = document.querySelectorAll('.delete-btn')
        deleteButtons.forEach(button => {
            button.addEventListener('click', function(event) {
                const categoryId = this.getAttribute('data-id')
                console.log(categoryId)
                if (confirm('정말 삭제하시겠습니까?')) {
                    deleteCategory(categoryId);
                }
            })
        })
    }

    async function deleteCategory(categoryId) {
        const url = `/categories/delete/${categoryId}`
        const result = await fetch(url, { method: 'DELETE' }).then(resp=>resp.json())

        if(result.success){
            alert(result.message)
            location.reload()  // 페이지 리로드하여 삭제된 항목 반영
        }else {
            alert(result.message)
        }
    }

    // DOMContentLoaded 이벤트가 발생하면 모든 초기화 작업 실행
    document.addEventListener('DOMContentLoaded', function() {
        addDeleteEventListeners()
        // 아이템 관리 버튼에 클릭 이벤트 리스너 추가
        const itemManageButtons = document.querySelectorAll('.item-manage-btn')
        itemManageButtons.forEach(button => {
            button.addEventListener('click', handleItemManageClick)
        })

        // 아이템 추가 버튼에 클릭 이벤트 리스너 추가
        const addItemButton = document.querySelector('.add-item-btn')
        if (addItemButton) {
            addItemButton.addEventListener('click',openAddItemModal )
        }

        // 모달 닫기 버튼에 클릭 이벤트 리스너 추가
        const closeModalButton = document.querySelector('.close-btn')
        if (closeModalButton) {
            closeModalButton.addEventListener('click', closeItemModal)
        }
    })

    // 아이템 관리 버튼 클릭 시 모달 열기
    function handleItemManageClick(event) {
        const categoryId = event.target.getAttribute('data-category-id')
        currentCategoryId = categoryId
        document.getElementById('itemModal').style.display = 'flex'

        // 모달 안에 아이템 목록 로드
        loadItemList(categoryId)
    }

    // 아이템 관리 모달 닫기
    function closeItemModal() {
        document.getElementById('itemModal').style.display = 'none'
    }

    // 아이템 추가 모달을 열기
    function openAddItemModal() {
        document.getElementById('addItemModal').style.display = 'flex';
    }

    // 아이템 추가 모달을 닫기
    function closeAddItemModal() {
        document.getElementById('addItemModal').style.display = 'none';
    }


    // 아이템 목록 로드
    async function loadItemList(categoryId) {
        const url = `/categories/${categoryId}/items`
        const result = await fetch(url).then(res => res.json())

        const itemListContainer = document.getElementById('itemList')
        itemListContainer.innerHTML = ''// 기존 목록 초기화
        if(result.success && result.items){
            if (result.message){
                alert(result.message)
                result.items.forEach(item => {
                    itemListContainer.innerHTML += `
                <div class="item-card">
                    <img src="/upload/items/${item.file.storedFileName}" alt="아이템 이미지">
                    <div class="card-content">
                        <div class="item-name">${item.name}</div>
                        <button class="view-btn" data-item-id="${item.id}" onclick="editItem(${item.id})">수정</button>
                         <button class="view-btn" data-item-id="${item.id}">삭제</button>
                    </div>
                </div>
            `
                })
            }else{
                result.items.forEach(item => {
                    itemListContainer.innerHTML += `
                <div class="item-card">
                    <img src="/upload/worldcup/items/${item.file.storedFileName}" alt="아이템 이미지">
                    <div class="card-content">
                        <div class="item-name">${item.name}</div>
                        <button class="view-btn" data-item-id="${item.id}" onclick="editItem(${item.id})">수정</button>
                       <button class="view-btn" data-item-id="${item.id}">삭제</button>
                    </div>
                </div>
            `
                })

                // Add event listeners for dynamically added buttons
                const editButtons = itemListContainer.querySelectorAll('.edit-btn')
                const deleteButtons = itemListContainer.querySelectorAll('.delete-btn')

                // Event listener for 수정 (edit) buttons
                editButtons.forEach(button => {
                    button.addEventListener('click', function(event) {
                        const itemId = event.target.getAttribute('data-item-id')
                        editItem(itemId) // Call the edit function
                    })
                })

                // Event listener for 삭제 (delete) buttons
                deleteButtons.forEach(button => {
                    button.addEventListener('click', function(event) {
                        const itemId = event.target.getAttribute('data-item-id')
                        deleteItem(itemId) // Call the delete function
                    })
                })
            }
        }
    }

    // 아이템 추가
    const addItemForm = document.getElementById('addItemForm')
    async function addItmeHandler(event) {
        event.preventDefault() // 기본 폼 제출 동작 방지
        const categoryId = 1
        const url = `/categories/items/add/${categoryId}`;

        const opt = {
            method: 'POST',
            body: new FormData(event.target)
        }

        const result = await fetch(url,opt).then(resp=>resp.json())

        if (result.success) {
            alert(result.message)
            loadItemList(categoryId)  // 아이템 목록을 새로고침
            closeAddItemModal()  // 추가 후 모달 닫기
        } else {
            alert(result.message)
        }
    }


    // 아이템 수정
    function editItem(itemId) {
        alert('아이템 수정: ' + itemId)
        // 실제 수정 로직을 추가해야 합니다.
    }

    // 아이템 삭제
    async function deleteItem(itemId) {
        const url = `/items/delete/${itemId}`
        const result = await fetch(url, { method: 'DELETE' }).then(res => res.json())

        if (result.success) {
            alert('아이템이 삭제되었습니다.')
            loadItemList(currentCategoryId) // 삭제 후 목록을 새로 고침
        } else {
            alert('아이템 삭제에 실패했습니다.')
        }
    }

    function locationHandler(){
        location.href = `/worldcup/category/add`
    }

    categoryAddBtn.addEventListener('click',locationHandler)
    addItemForm.addEventListener('submit',addItmeHandler)
    searchForm.addEventListener('submit' , searchHandler)
</script>
</body>
</html>
